# ==============================================================================
# Render Blueprint Specification for CampusConnect Microservices & API Gateway
# Lab 7: Cloud Deployment
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. API Gateway (Public Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: campusconnect-api-gateway
    env: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-user-service
          property: host
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-product-service
          property: host
      - key: ORDER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-order-service
          property: host

  # ----------------------------------------------------------------------------
  # 2. User Microservice (Internal or Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: campusconnect-user-service
    env: docker
    dockerfilePath: ./user-service/Dockerfile
    dockerContext: ./user-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Set via Render Dashboard with MongoDB Atlas Connection String

  # ----------------------------------------------------------------------------
  # 3. Product Microservice
  # ----------------------------------------------------------------------------
  - type: web
    name: campusconnect-product-service
    env: docker
    dockerfilePath: ./product-service/Dockerfile
    dockerContext: ./product-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3002
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false

  # ----------------------------------------------------------------------------
  # 4. Order Microservice
  # ----------------------------------------------------------------------------
  - type: web
    name: campusconnect-order-service
    env: docker
    dockerfilePath: ./order-service/Dockerfile
    dockerContext: ./order-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3003
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-user-service
          property: host
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-product-service
          property: host
